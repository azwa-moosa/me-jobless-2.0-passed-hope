# DEV infrastructure only. SYNTHETIC DATA ONLY – never load real employee data.
name: bml-people-er-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app_migrator
      POSTGRES_PASSWORD: app_migrator_dev
      POSTGRES_DB: bml_people_er
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_migrator -d bml_people_er"]
      interval: 5s
      retries: 10
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite-blob --blobHost 0.0.0.0 --loose
    ports: ["10000:10000"]
  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025", "1025:1025"]
volumes:
  pgdata:
